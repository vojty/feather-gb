name: github-pages

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Setup Vite+ + install dependencies
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          version-file: pnpm-workspace.yaml
          cache: true

      - name: Build WASM + list of ROMs
        run: |
          pnpm run build:gb 
          pnpm run build:debugger
          node generateRomsList.js

      - name: Check frontend
        run: vp check

      - name: Building App
        run: USE_HASH_ROUTER=true pnpm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
